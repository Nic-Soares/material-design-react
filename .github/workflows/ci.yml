name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Node version comes from .nvmrc
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lint and format check, without writing fixes
      - name: Biome
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      # The committed tokens must be what the generators produce
      - name: Generated tokens up to date
        run: |
          npm run tokens
          git diff --exit-code src/tokens/color.css src/tokens/motion.css

      # Unit and accessibility tests, with the coverage report in the log
      - name: Tests
        run: npm run coverage

      - name: Build
        run: npm run build

      # The packed library installs and builds in a clean Vite app, keeps
      # its styles and tree-shakes the components it doesn't use
      - name: Smoke test
        run: npm run smoke

      # Docs must build too: a broken story fails the pull request
      - name: Storybook build
        run: npm run build-storybook

      # The published tarball holds only what consumers need
      - name: Package contents
        run: npm pack --dry-run
