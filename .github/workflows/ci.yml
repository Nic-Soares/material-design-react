name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Node version comes from .nvmrc
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lint and format check, without writing fixes
      - name: Biome
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The published tarball holds only what consumers need
      - name: Package contents
        run: npm pack --dry-run
