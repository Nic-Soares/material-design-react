name: Release

# Stages a version on npm when a GitHub Release is published for a vX.Y.Z
# tag; the owner then approves it with 2FA (docs/runbooks/releases.md).
# Nothing else publishes: merging to main never does.
on:
  release:
    types: [published]

permissions:
  contents: read
  # OIDC token for npm trusted publishing and provenance
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Named in npm's trusted publisher settings; GitHub can add required
    # reviewers to it for a manual approval before each publish
    environment: npm

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag names the version that package.json declares
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi

      - name: Biome
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The packed library installs and builds in a clean Vite app
      - name: Smoke test
        run: npm run smoke

      # Staged publishing through trusted publishing (OIDC): the version
      # waits on npm, not public, until the owner approves it with 2FA
      # (docs/runbooks/releases.md). No token is stored; provenance links
      # the version to this run.
      - name: Stage on npm
        run: npm stage publish --provenance --access public
